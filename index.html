<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#143c36"><meta name="apple-mobile-web-app-capable" content="yes"><title>Life OS · 我的记录</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head>
<body><main class="app">
<header><div><span class="brand">L</span><b>Life OS</b></div><span class="tag">手机体验版</span></header>
<section class="hero"><p class="eyebrow">ONE DAY AT A TIME</p><h1>把时间，<br>留给重要的事。</h1><p>记录真实的每一步，慢慢看见变化。</p></section>
<div class="notice"><b>记录暂存在这部手机</b><span>电脑同步尚未开通。清除浏览器数据可能丢失记录，请先用虚拟内容体验。</span></div>
<p id="message" class="message" role="status" aria-live="polite"></p>
<section class="card current"><div class="heading"><div><span class="eyebrow">RIGHT NOW</span><h2>正在进行</h2></div><span class="live" id="active-indicator">● 等待开始</span></div><div id="current"></div></section>
<section class="card"><div class="heading"><div><span class="eyebrow">A NEW MOMENT</span><h2>开始一项活动</h2></div></div><form id="start-form"><label>活动名称<input name="name" maxlength="120" required placeholder="例如：学习 JavaScript"></label><div class="row"><label>分类<input name="category" maxlength="60" placeholder="例如：学习、休息" list="category-options"><datalist id="category-options"><option value="学习"><option value="工作"><option value="生活"><option value="健康"><option value="休息"></datalist></label><label>预计时长（分钟）<input name="planned" type="number" min="1" max="100000" inputmode="numeric" placeholder="可不填"></label></div><label>预期目标<textarea name="goal" rows="2" maxlength="2000" placeholder="这次想完成什么？（可不填）"></textarea></label><button class="primary" type="submit">开始活动 <span>→</span></button><small>如果正在进行其他活动，会先暂停它。</small></form></section>
<section class="card"><div class="heading"><div><span class="eyebrow">YOUR TIMELINE</span><h2>我的活动</h2></div><span id="count" class="muted">0 项</span></div><div id="activities"></div></section>
<section class="card"><div class="heading"><div><span class="eyebrow">A MOMENT FOR YOU</span><h2>今日心得</h2></div></div><label>写下你的想法<textarea id="reflection" rows="3" maxlength="5000" placeholder="今天有什么感受？"></textarea></label><button id="save-reflection" class="secondary" type="button">保存心得</button><small>只保存在本机，不会由 AI 修改。</small></section>
<footer>Life OS · 记录过程，也关注结果</footer>
</main></body></html>
